[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "har-sanitize"
version = "0.1.0"
description = "Redact credentials and personal data from HTTP Archive (HAR) files before sharing them."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "wyn-cmd" }]
keywords = ["har", "http-archive", "redaction", "secrets", "devtools"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
]

[project.scripts]
har-sanitize = "har_sanitize:main"

[tool.setuptools]
py-modules = ["har_sanitize"]
